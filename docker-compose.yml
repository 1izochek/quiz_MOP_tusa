services:
  party-quiz:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Укажите ADMIN_PASSWORD в .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-200}
      NICKNAME_BLOCKLIST: ${NICKNAME_BLOCKLIST:-}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    stop_grace_period: 20s
